<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f131b"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a8d8ff"/>
      <stop offset="1" stop-color="#3b6dff"/>
    </radialGradient>
    <linearGradient id="ring" x1="150" y1="512" x2="874" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#5b9cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg2)"/>

  <!-- Orbit ring -->
  <g transform="rotate(-18 512 512)">
    <ellipse cx="512" cy="512" rx="330" ry="132" stroke="url(#ring)"
             stroke-width="34" fill="none" stroke-linecap="round"/>
    <!-- Satellite -->
    <circle cx="806" cy="452" r="46" fill="#a8d8ff" filter="url(#soft)"/>
    <circle cx="806" cy="452" r="40" fill="#eaf5ff"/>
  </g>

  <!-- Core -->
  <circle cx="512" cy="512" r="128" fill="#3b6dff" filter="url(#soft)" opacity="0.8"/>
  <circle cx="512" cy="512" r="112" fill="url(#core)"/>
</svg>
