      <stop offset="0" stop-color="#10141c"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="mg" x1="200" y1="280" x2="830" y2="800" gradientUnits="userSpaceOnUse">
