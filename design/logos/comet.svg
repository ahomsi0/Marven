    <path d="M668 356 L300 724" stroke="#fdba74" stroke-opacity="0.22" stroke-width="92"/>
    <path d="M648 376 L362 662" stroke="#fdba74" stroke-opacity="0.45" stroke-width="58"/>
    <path d="M656 368 L430 594" stroke="#ffedd5" stroke-opacity="0.9" stroke-width="30"/>
  </g>

  <!-- Head -->
  <circle cx="720" cy="304" r="112" fill="#fdba74" filter="url(#glowc2)" opacity="0.85"/>
  <circle cx="720" cy="304" r="96" fill="url(#head)"/>
