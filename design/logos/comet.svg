<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgc2" cx="0.35" cy="0.3" r="1.1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="head" x1="620" y1="220" x2="820" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="glowc2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
