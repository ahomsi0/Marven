<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pbg2" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#101726"/>
      <stop offset="1" stop-color="#070b13"/>
    </radialGradient>
    <filter id="beamglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#pbg2)"/>

  <!-- incoming white beam -->
  <line x1="96" y1="552" x2="396" y2="466" stroke="#ffffff" stroke-width="14"
        stroke-linecap="round" filter="url(#beamglow)" opacity="0.85"/>
  <line x1="96" y1="552" x2="396" y2="466" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round"/>

  <!-- glass prism (equilateral, apex up) -->
  <polygon points="512,240 280,680 744,680" fill="#dbeafe" opacity="0.07"/>
  <polygon points="512,240 280,680 744,680" stroke="#e2e8f0" stroke-opacity="0.65"
           stroke-width="10" stroke-linejoin="round"/>
  <!-- internal facet hint -->
  <line x1="512" y1="240" x2="512" y2="680" stroke="#e2e8f0" stroke-opacity="0.18" stroke-width="6"/>

  <!-- dispersed spectrum -->
  <g stroke-linecap="round" filter="url(#beamglow)">
    <line x1="640" y1="452" x2="952" y2="252" stroke="#FF5252" stroke-width="12" opacity="0.75"/>
    <line x1="642" y1="462" x2="958" y2="352" stroke="#FFB74D" stroke-width="12" opacity="0.75"/>
    <line x1="644" y1="472" x2="960" y2="452" stroke="#FFE57F" stroke-width="12" opacity="0.75"/>
    <line x1="644" y1="482" x2="958" y2="548" stroke="#69F0AE" stroke-width="12" opacity="0.75"/>
    <line x1="642" y1="492" x2="952" y2="636" stroke="#448AFF" stroke-width="12" opacity="0.75"/>
    <line x1="640" y1="500" x2="944" y2="716" stroke="#B388FF" stroke-width="12" opacity="0.75"/>
  </g>
  <g stroke-linecap="round">
    <line x1="640" y1="452" x2="952" y2="252" stroke="#FF5252" stroke-width="5"/>
    <line x1="642" y1="462" x2="958" y2="352" stroke="#FFB74D" stroke-width="5"/>
    <line x1="644" y1="472" x2="960" y2="452" stroke="#FFE57F" stroke-width="5"/>
    <line x1="644" y1="482" x2="958" y2="548" stroke="#69F0AE" stroke-width="5"/>
    <line x1="642" y1="492" x2="952" y2="636" stroke="#448AFF" stroke-width="5"/>
    <line x1="640" y1="500" x2="944" y2="716" stroke="#B388FF" stroke-width="5"/>
  </g>
</svg>
