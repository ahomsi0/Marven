name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs our postinstall, which normally rebuilds better-sqlite3
      # against Electron's Node ABI. In CI we want to test against the
      # *prebuilt Node* binary (so vitest under system Node can dlopen it), so
      # we skip the Electron rebuild. The release workflow does its own rebuild.
      - name: Install dependencies (host Node ABI)
        run: npm ci
        env:
          MARVEN_SKIP_ELECTRON_REBUILD: "1"
          # onnxruntime-node otherwise downloads CUDA GPU binaries from nuget.org
          # on Linux; Marven only uses the bundled CPU runtime, and that
          # download timing out has failed CI.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev
